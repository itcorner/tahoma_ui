services:
  tahoma-ui:
    build: .
    container_name: tahoma-ui
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-3000}"
    #  TAHOMA_BASE_URL: https://gateway-2001-0001-1891.local:8443/enduser-mobile-web/1/enduserAPI
    #  TAHOMA_BEARER_TOKEN: replace_with_your_tahoma_bearer_token
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false